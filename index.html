<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>請假通知系統 — 實康復健科診所</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --teal: #1D9E75;
      --teal-light: #E1F5EE;
      --teal-mid: #9FE1CB;
      --teal-dark: #0F6E56;
      --teal-deeper: #085041;
      --gray-bg: #F7F7F5;
      --gray-border: #E0DED8;
      --gray-text: #888780;
      --text: #2C2C2A;
      --text-sub: #5F5E5A;
      --white: #FFFFFF;
      --radius: 10px;
      --radius-sm: 6px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue",
        "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
      background: var(--gray-bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .header .clinic-name {
      font-size: 13px;
      color: var(--gray-text);
      letter-spacing: 0.05em;
      margin-bottom: 0.4rem;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .header .subtitle {
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 0.3rem;
    }

    .card {
      background: var(--white);
      border: 1px solid var(--gray-border);
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      margin-bottom: 1rem;
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gray-text);
      margin-bottom: 0.75rem;
    }

    /* 治療師選擇 */
    .therapist-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .therapist-btn {
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--gray-border);
      background: var(--white);
      cursor: pointer;
      text-align: left;
      transition: border-color 0.15s, background 0.15s;
    }

    .therapist-btn:hover {
      border-color: var(--teal-mid);
    }

    .therapist-btn.selected {
      border: 1.5px solid var(--teal);
      background: var(--teal-light);
    }

    .therapist-btn .t-name {
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      display: block;
    }

    .therapist-btn.selected .t-name {
      color: var(--teal-dark);
    }

    .therapist-btn .t-role {
      font-size: 11px;
      color: var(--gray-text);
      display: block;
      margin-top: 2px;
    }

    .therapist-btn.selected .t-role {
      color: var(--teal-dark);
      opacity: 0.75;
    }

    /* 日期 */
    .date-input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--gray-border);
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-family: inherit;
      color: var(--text);
      background: var(--white);
      outline: none;
      transition: border-color 0.15s;
    }

    .date-input:focus {
      border-color: var(--teal);
    }

    /* 個案清單 */
    .cases-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .select-all-btn {
      font-size: 12px;
      color: var(--teal);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      font-family: inherit;
    }

    .select-all-btn:hover {
      color: var(--teal-dark);
    }

    .cases-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .case-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--gray-border);
      background: var(--white);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      user-select: none;
    }

    .case-item:hover {
      border-color: var(--teal-mid);
    }

    .case-item.checked {
      border-color: var(--teal);
      background: var(--teal-light);
    }

    .case-checkbox {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      border: 1.5px solid var(--gray-border);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--white);
      transition: background 0.15s, border-color 0.15s;
    }

    .case-item.checked .case-checkbox {
      background: var(--teal);
      border-color: var(--teal);
    }

    .check-svg {
      display: none;
      width: 10px;
      height: 10px;
    }

    .case-item.checked .check-svg {
      display: block;
    }

    .case-name {
      font-size: 13px;
      color: var(--text);
    }

    .case-item.checked .case-name {
      color: var(--teal-dark);
      font-weight: 500;
    }

    .count-badge {
      display: inline-block;
      font-size: 11px;
      background: var(--teal-light);
      color: var(--teal-dark);
      padding: 2px 8px;
      border-radius: 99px;
      margin-left: 8px;
      font-weight: 500;
      vertical-align: middle;
    }

    .placeholder-msg {
      font-size: 13px;
      color: var(--gray-text);
      text-align: center;
      padding: 1rem 0;
    }

    /* 訊息預覽 */
    .preview-box {
      background: var(--gray-bg);
      border: 1px solid var(--gray-border);
      border-radius: var(--radius-sm);
      padding: 1rem 1.25rem;
      font-size: 13px;
      line-height: 1.8;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .preview-placeholder {
      font-size: 13px;
      color: var(--gray-text);
      text-align: center;
      padding: 1rem 0;
    }

    .preview-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 0.75rem;
    }

    .preview-nav button {
      font-size: 12px;
      color: var(--teal);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      font-family: inherit;
    }

    .preview-nav button:disabled {
      color: var(--gray-text);
      cursor: default;
    }

    .preview-counter {
      font-size: 12px;
      color: var(--gray-text);
    }

    /* 送出按鈕 */
    .send-btn {
      width: 100%;
      padding: 13px;
      background: var(--teal);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      margin-top: 0.5rem;
      letter-spacing: 0.01em;
    }

    .send-btn:hover:not(:disabled) {
      background: var(--teal-dark);
    }

    .send-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* 狀態訊息 */
    .status-bar {
      display: none;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      margin-top: 0.75rem;
      line-height: 1.5;
    }

    .status-bar.success {
      background: var(--teal-light);
      color: var(--teal-dark);
      border: 1px solid var(--teal-mid);
    }

    .status-bar.error {
      background: #FCEBEB;
      color: #791F1F;
      border: 1px solid #F7C1C1;
    }

    .status-bar.loading {
      background: #F0F0EE;
      color: var(--text-sub);
      border: 1px solid var(--gray-border);
    }

    /* 分隔線 */
    hr {
      border: none;
      border-top: 1px solid var(--gray-border);
      margin: 0.25rem 0 1rem;
    }

    @media (max-width: 400px) {
      .therapist-grid,
      .cases-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<div class="container">

  <div class="header">
    <p class="clinic-name">實康復健科診所</p>
    <h1>請假通知系統</h1>
    <p class="subtitle">選擇個案後，系統將自動傳送 LINE 通知給家長</p>
  </div>

  <!-- 治療師 -->
  <div class="card">
    <p class="section-label">治療師</p>
    <div class="therapist-grid" id="therapist-grid">
      <!-- 由 JS 動態產生 -->
    </div>
  </div>

  <!-- 請假日期 -->
  <div class="card">
    <p class="section-label">請假日期</p>
    <input type="date" class="date-input" id="leave-date" />
  </div>

  <!-- 個案清單 -->
  <div class="card">
    <div class="cases-header">
      <p class="section-label" style="margin-bottom:0">
        通知個案
        <span class="count-badge" id="count-badge" style="display:none"></span>
      </p>
      <button class="select-all-btn" id="select-all-btn" onclick="toggleAll()" style="display:none">
        全選／取消全選
      </button>
    </div>
    <div id="cases-area">
      <p class="placeholder-msg">請先選擇治療師</p>
    </div>
  </div>

  <!-- 訊息預覽 -->
  <div class="card">
    <p class="section-label">訊息預覽</p>
    <div id="preview-area">
      <p class="preview-placeholder">請完成上方選項後查看預覽</p>
    </div>
  </div>

  <!-- 送出 -->
  <button class="send-btn" id="send-btn" disabled onclick="handleSend()">
    傳送通知
  </button>

  <div class="status-bar" id="status-bar"></div>

</div>

<script>
  // ── 設定區（部署時請確認以下兩個值）──────────────────────────────
  const APPS_SCRIPT_URL = "YOUR_APPS_SCRIPT_WEB_APP_URL";
  // ────────────────────────────────────────────────────────────────

  // 治療師資料（從 Apps Script 取得後動態填入，初始為空）
  let therapists = [];
  // 個案資料 { "治療師名": ["個案名", ...] }
  let caseMap = {};

  let selectedTherapist = null;
  let selectedCases = new Set();
  let previewMessages = [];
  let previewIndex = 0;

  // ── 初始化 ───────────────────────────────────────────────────────
  async function init() {
    // 設定今天為預設日期
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, "0");
    const dd = String(today.getDate()).padStart(2, "0");
    document.getElementById("leave-date").value = `${yyyy}-${mm}-${dd}`;
    document.getElementById("leave-date").addEventListener("change", updatePreview);

    await loadTherapistsAndCases();
  }

  // ── 從 Apps Script 載入治療師與個案資料 ──────────────────────────
  async function loadTherapistsAndCases() {
    try {
      const res = await fetch(`${APPS_SCRIPT_URL}?action=getCases`);
      const data = await res.json();
      therapists = data.therapists;
      caseMap = data.cases;
    } catch (e) {
      // 若無法連線，使用預設資料（開發時用）
      therapists = [
        { name: "李彥霖", role: "職能治療師" },
        { name: "汪品妤", role: "職能治療師" },
        { name: "林妡穎", role: "語言治療師" },
      ];
      caseMap = {
        "李彥霖": [],
        "汪品妤": [],
        "林妡穎": [],
      };
    }
    renderTherapists();
  }

  // ── 渲染治療師按鈕 ────────────────────────────────────────────────
  function renderTherapists() {
    const grid = document.getElementById("therapist-grid");
    grid.innerHTML = therapists.map(t => `
      <button class="therapist-btn" data-name="${t.name}" onclick="selectTherapist(this)">
        <span class="t-name">${t.name}</span>
        <span class="t-role">${t.role}</span>
      </button>
    `).join("");
  }

  // ── 選擇治療師 ────────────────────────────────────────────────────
  function selectTherapist(btn) {
    document.querySelectorAll(".therapist-btn").forEach(b => b.classList.remove("selected"));
    btn.classList.add("selected");
    selectedTherapist = btn.dataset.name;
    selectedCases.clear();
    renderCases();
    updatePreview();
  }

  // ── 渲染個案清單 ──────────────────────────────────────────────────
  function renderCases() {
    const area = document.getElementById("cases-area");
    const selectAllBtn = document.getElementById("select-all-btn");
    const cases = caseMap[selectedTherapist] || [];

    if (cases.length === 0) {
      area.innerHTML = `<p class="placeholder-msg">此治療師目前沒有個案資料</p>`;
      selectAllBtn.style.display = "none";
      return;
    }

    selectAllBtn.style.display = "block";

    area.innerHTML = `
      <div class="cases-grid">
        ${cases.map(c => `
          <div class="case-item" data-case="${c}" onclick="toggleCase(this)">
            <div class="case-checkbox">
              <svg class="check-svg" viewBox="0 0 10 10" fill="none">
                <polyline points="1.5,5 4,7.5 8.5,2.5" stroke="white" stroke-width="1.8"
                  stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <span class="case-name">${c}</span>
          </div>
        `).join("")}
      </div>
    `;
    updateCountBadge();
  }

  // ── 勾選個案 ──────────────────────────────────────────────────────
  function toggleCase(el) {
    const name = el.dataset.case;
    if (selectedCases.has(name)) {
      selectedCases.delete(name);
      el.classList.remove("checked");
    } else {
      selectedCases.add(name);
      el.classList.add("checked");
    }
    updateCountBadge();
    updatePreview();
  }

  // ── 全選／取消全選 ────────────────────────────────────────────────
  function toggleAll() {
    const items = document.querySelectorAll(".case-item");
    const allChecked = [...items].every(i => i.classList.contains("checked"));
    items.forEach(i => {
      const name = i.dataset.case;
      if (allChecked) {
        selectedCases.delete(name);
        i.classList.remove("checked");
      } else {
        selectedCases.add(name);
        i.classList.add("checked");
      }
    });
    updateCountBadge();
    updatePreview();
  }

  // ── 更新計數 ──────────────────────────────────────────────────────
  function updateCountBadge() {
    const badge = document.getElementById("count-badge");
    if (selectedCases.size > 0) {
      badge.textContent = `已選 ${selectedCases.size} 位`;
      badge.style.display = "inline-block";
    } else {
      badge.style.display = "none";
    }
  }

  // ── 更新訊息預覽 ──────────────────────────────────────────────────
  function updatePreview() {
    const dateVal = document.getElementById("leave-date").value;
    const previewArea = document.getElementById("preview-area");
    const sendBtn = document.getElementById("send-btn");

    if (!selectedTherapist || !dateVal || selectedCases.size === 0) {
      previewArea.innerHTML = `<p class="preview-placeholder">請完成上方選項後查看預覽</p>`;
      sendBtn.disabled = true;
      previewMessages = [];
      return;
    }

    const d = new Date(dateVal + "T00:00:00");
    const dateStr = `${d.getFullYear()} 年 ${d.getMonth() + 1} 月 ${d.getDate()} 日`;

    previewMessages = [...selectedCases].map(caseName =>
      `您好，\n\n${selectedTherapist}治療師因故請假，\n${caseName} 於 ${dateStr} 的療程將暫停一次。\n\n造成不便敬請見諒，如有疑問請與診所聯繫。\n\n— 實康復健科診所`
    );

    previewIndex = 0;
    renderPreview();
    sendBtn.disabled = false;
  }

  function renderPreview() {
    const previewArea = document.getElementById("preview-area");
    if (previewMessages.length === 0) return;

    const total = previewMessages.length;
    const navHtml = total > 1 ? `
      <div class="preview-nav">
        <button onclick="changePreview(-1)" id="prev-btn" ${previewIndex === 0 ? "disabled" : ""}>← 上一則</button>
        <span class="preview-counter">${previewIndex + 1} / ${total}</span>
        <button onclick="changePreview(1)" id="next-btn" ${previewIndex === total - 1 ? "disabled" : ""}>下一則 →</button>
      </div>
    ` : "";

    previewArea.innerHTML = `
      <div class="preview-box">${previewMessages[previewIndex]}</div>
      ${navHtml}
    `;
  }

  function changePreview(dir) {
    const total = previewMessages.length;
    previewIndex = Math.max(0, Math.min(total - 1, previewIndex + dir));
    renderPreview();
  }

  // ── 送出通知 ──────────────────────────────────────────────────────
  async function handleSend() {
    const dateVal = document.getElementById("leave-date").value;
    const sendBtn = document.getElementById("send-btn");
    const statusBar = document.getElementById("status-bar");

    const payload = {
      action: "sendLeaveNotice",
      therapist: selectedTherapist,
      date: dateVal,
      cases: [...selectedCases],
    };

    sendBtn.disabled = true;
    showStatus("loading", "傳送中，請稍候…");

    try {
      const res = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payload),
      });
      const result = await res.json();

      if (result.success) {
        showStatus("success", `✓ 已成功傳送 ${result.sent} 則通知`);
        selectedCases.clear();
        document.querySelectorAll(".case-item").forEach(i => i.classList.remove("checked"));
        updateCountBadge();
        updatePreview();
      } else {
        showStatus("error", `傳送失敗：${result.message || "請稍後再試"}`);
        sendBtn.disabled = false;
      }
    } catch (e) {
      showStatus("error", "無法連線至伺服器，請確認網路後再試");
      sendBtn.disabled = false;
    }
  }

  function showStatus(type, msg) {
    const bar = document.getElementById("status-bar");
    bar.className = `status-bar ${type}`;
    bar.textContent = msg;
    bar.style.display = "block";
    if (type === "success") {
      setTimeout(() => { bar.style.display = "none"; }, 5000);
    }
  }

  // ── 啟動 ──────────────────────────────────────────────────────────
  init();
</script>

</body>
</html>
